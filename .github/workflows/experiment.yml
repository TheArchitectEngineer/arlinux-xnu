name: Darwin iOS compatibility experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: native
        options: [both, host, baseline, native, dyld]
permissions:
  contents: read
jobs:
  host-substrate:
    if: inputs.mode == 'both' || inputs.mode == 'host'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ARM64 host diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host
          cp sources.lock.json build/host/
          uname -a | tee build/host/environment.txt
          getconf PAGE_SIZE | tee -a build/host/environment.txt
          cc --version | tee -a build/host/environment.txt
          cc -Wall -Wextra -Werror -O2 -g tools/host-substrate.c -o build/host/host-substrate
          file build/host/host-substrate | tee build/host/file.txt
          timeout 30 build/host/host-substrate | tee build/host/run.log
          (cd build/host && sha256sum host-substrate > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/host --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-host-substrate
          path: build/host/
          retention-days: 30
  macho-userland:
    if: inputs.mode == 'both' || inputs.mode == 'host'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Mach-O toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Build and execute the freestanding Darwin program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/macho
          cp sources.lock.json build/macho/
          uname -a > build/macho/environment.txt
          clang-18 --version >> build/macho/environment.txt
          ld64.lld-18 --version >> build/macho/environment.txt
          clang-18 --target=arm64-apple-ios13.0 -c guests/hello.S -o build/macho/hello.o
          ld64.lld-18 -arch arm64 -platform_version ios 13.0 13.0 -no_adhoc_codesign -e _start build/macho/hello.o -o build/macho/hello.macho
          llvm-objdump-18 --macho --private-headers build/macho/hello.macho > build/macho/load-commands.txt
          cc -Wall -Wextra -Werror -O2 -g src/macho-host.c -o build/macho/macho-host
          file build/macho/macho-host build/macho/hello.macho | tee build/macho/file.txt
          timeout 30 build/macho/macho-host build/macho/hello.macho > build/macho/guest.stdout 2> build/macho/host.log
          cat build/macho/guest.stdout build/macho/host.log
          (cd build/macho && sha256sum macho-host hello.macho > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/macho --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-macho-userland
          path: build/macho/
          retention-days: 30
  native-userland:
    if: inputs.mode == 'both' || inputs.mode == 'native' || inputs.mode == 'dyld'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 Mach-O compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Build and run native Darwin console journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native
          uname -a > build/native/environment.txt
          getconf PAGE_SIZE >> build/native/environment.txt
          cc --version >> build/native/environment.txt
          clang-18 --version >> build/native/environment.txt
          ld64.lld-18 --version >> build/native/environment.txt
          clang-18 --target=arm64-apple-ios13.0 -c guests/console.S -o build/native/console.o
          ld64.lld-18 -arch arm64 -platform_version ios 13.0 13.0 -no_adhoc_codesign -e _start build/native/console.o -o build/native/console.macho
          llvm-objdump-18 --macho --disassemble --private-headers build/native/console.macho > build/native/image.txt
          cc -Wall -Wextra -Werror -O2 -g -fno-stack-protector -ffreestanding -fno-builtin -mgeneral-regs-only -c src/darwin-native.c -o build/native/runtime.o
          cc -c src/darwin-native.S -o build/native/entry.o
          cc -Wall -Wextra -Werror -O2 -g src/macho-native.c build/native/runtime.o build/native/entry.o -ldl -o build/native/macho-native
          # Two complete independent launches of the interactive program, not
          # a source assertion or isolated TLS probe. Runtime exit status is
          # the guest's real Linux-backed normal process exit status.
          for attempt in 1 2; do
            status=0
            printf '+q' | timeout 30 build/native/macho-native build/native/console.macho > build/native/console-$attempt.stdout 2> build/native/console-$attempt.log || status=$?
            cat build/native/console-$attempt.stdout build/native/console-$attempt.log
            if [[ $status != 0 ]]; then exit "$status"; fi
          done
          (cd build/native && sha256sum macho-native console.macho > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/native --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-native-darwin
          path: build/native/
          retention-days: 30
  dyld-userland:
    if: inputs.mode == 'dyld'
    needs: native-userland
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-native-darwin
          path: build/native/
      - name: Install Apple filesystem reader
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip llvm-18 cmake fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev
      - name: Prepare pinned Apple userland and execute its actual dyld
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dyld
          uname -a > build/dyld/environment.txt
          (cd build/native && sha256sum -c SHA256SUMS)
          chmod +x build/native/macho-native
          python3 tools/prepare-ios-userland.py 2>&1 | tee build/dyld/input.log
          llvm-objdump-18 --macho --private-headers build/ios-input/dyld > build/dyld/loader-commands.txt
          llvm-nm-18 --numeric-sort --demangle build/ios-input/dyld > build/dyld/loader-symbols.txt
          status=0
          printf '+q' | timeout 30 build/native/macho-native --dyld build/ios-input/dyld build/native/console.macho > build/dyld/console.stdout 2> build/dyld/runtime.log || status=$?
          cat build/dyld/console.stdout build/dyld/runtime.log
          exit "$status"
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/dyld --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-apple-dyld-evidence
          path: build/dyld/
          retention-days: 30
  xnu-baseline:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned ios-sweet XNU baseline (not usermode)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-baseline.sh 2>&1 | tee baseline.log
      - name: Retain provenance and logs
        if: always()
        shell: bash
        run: |
          mkdir -p out-baseline
          cp sources.lock.json out-baseline/
          cp baseline.log out-baseline/ || true
          sw_vers > out-baseline/environment.txt
          xcodebuild -version >> out-baseline/environment.txt
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory out-baseline --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
          retention-days: 30
  xnu-reference-boot:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    needs: xnu-baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
      - name: Install full-system ARM64 execution and symbol tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm llvm
      - name: Execute original XNU process journey (reference only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference
          bash tools/run-baseline.sh 2>&1 | tee build/reference/run.log
      - name: Record reference receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/reference --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-full-system-reference
          path: build/reference/
          retention-days: 30
