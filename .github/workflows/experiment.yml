              --lookup /usr/lib/system/libxpc.dylib _bootstrap_register \
              --lookup /usr/lib/system/libxpc.dylib _bootstrap_register2
          fi
          status=0
          timeout 45 lldb-18 --batch -o 'command source -e true -s false tools/trace-dyld.lldb' > build/dyld/lldb.log 2>&1 || status=$?
          cat build/dyld/lldb.log
          echo "LLDB_COMMAND_STATUS=$status"
          if [[ -f build/ios-input/filesystem/root/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64 ]]; then
            python3 tools/symbolicate-cache.py build/ios-input/filesystem/root/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64 build/dyld/lldb.log build/dyld/cache-frames.json
          fi
          exit "$status"
      - name: Stop runner Wayland compositor
        if: (always() && inputs.mode == 'app') && (inputs.mode == 'dyld' || inputs.mode == 'app')
        shell: bash
        run: |
          if [[ -f build/dyld/weston.pid ]]; then
            kill -- "$(cat build/dyld/weston.pid)" || true
          fi
      - name: Stop unified iOS session
        if: (always() && inputs.ipc == 'darling') && (inputs.mode == 'dyld' || inputs.mode == 'app')
        shell: bash
        run: |
          if [[ -f build/dyld/session.pid ]]; then
            kill -- "$(cat build/dyld/session.pid)" 2>/dev/null || true
            cat build/dyld/session.log build/dyld/session.stdout
          fi
      - name: Record compiler cache results
        if: always() && steps.cache_accounting.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          counters = dict((key, int(value)) for key, value in
                          (line.split() for line in subprocess.check_output(['ccache', '--print-stats'], text=True).splitlines()))
          summary = {'directHits': counters.get('direct_cache_hit', 0),
                     'preprocessedHits': counters.get('preprocessed_cache_hit', 0),
                     'misses': counters.get('cache_miss', 0),
                     'counters': counters}
          for name in ('build/darling-ipc', 'build/native', 'build/dyld'):
              directory = pathlib.Path(name)
              if directory.exists():
                  (directory / 'compiler-cache.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('COMPILER_CACHE_STATS ' + json.dumps({key: value for key, value in summary.items() if key != 'counters'}))
          PY
          ccache --show-stats
      - name: Save successful compilation cache
        if: always() && steps.compiler_cache.outputs.cache-hit != 'true' && (steps.native_build.outcome == 'success' || (inputs.mode == 'darling' && steps.core_build.outcome == 'success'))
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - name: Record experiment receipt
        if: (always()) && (inputs.mode == 'darling' || inputs.ipc == 'darling')
        run: python3 tools/experiment-receipt.py --directory build/darling-ipc --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: (always()) && (inputs.mode == 'darling' || inputs.ipc == 'darling')
        with:
          name: linux-arm64-mach-core
          path: build/darling-ipc/
          retention-days: 30
      - name: Record experiment receipt
        if: (always()) && (inputs.mode != 'darling')
        run: python3 tools/experiment-receipt.py --directory build/native --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: (always()) && (inputs.mode != 'darling')
        with:
          name: linux-arm64-native-darwin
          path: build/native/
          retention-days: 30
      - name: Record experiment receipt
        if: (always()) && (inputs.mode == 'dyld' || inputs.mode == 'app')
        run: python3 tools/experiment-receipt.py --directory build/dyld --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: (always()) && (inputs.mode == 'dyld' || inputs.mode == 'app')
        with:
          name: linux-arm64-apple-dyld-evidence
          path: |
            build/dyld/
            !build/dyld/wayland-runtime/**
            !build/dyld/**/*.bgra
          retention-days: 30
  playcover-reference:
    if: always() && needs.native-userland.result == 'success' && inputs.mode == 'playcover'
    needs: native-userland
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-native-darwin
          path: build/native/
      - name: Observe the same iOS app through PlayCover conversion on macOS
        shell: bash
        run: |
          set -euo pipefail
          (cd build/native && shasum -a 256 -c SHA256SUMS)
          mkdir -p build/playcover
          uname -a > build/playcover/environment.txt
          sw_vers >> build/playcover/environment.txt
          xcodebuild -version >> build/playcover/environment.txt
          python3 tools/run-playcover-reference.py
      - name: Record reference receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/playcover --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-playcover-reference
          path: build/playcover/
          retention-days: 30
  xnu-baseline:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned ios-sweet XNU baseline (not usermode)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-baseline.sh 2>&1 | tee baseline.log
      - name: Retain provenance and logs
        if: always()
        shell: bash
        run: |
          mkdir -p out-baseline
          cp sources.lock.json out-baseline/
          cp baseline.log out-baseline/ || true
          sw_vers > out-baseline/environment.txt
          xcodebuild -version >> out-baseline/environment.txt
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory out-baseline --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
          retention-days: 30
  xnu-reference-boot:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    needs: xnu-baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
      - name: Install full-system ARM64 execution and symbol tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm llvm
      - name: Execute original XNU process journey (reference only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference
          bash tools/run-baseline.sh 2>&1 | tee build/reference/run.log
      - name: Record reference receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/reference --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-full-system-reference
          path: build/reference/
          retention-days: 30
