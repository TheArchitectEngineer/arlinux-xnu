name: Darwin iOS compatibility experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: native
        options: [both, host, baseline, native, dyld, app, playcover, darling]
      ipc:
        type: choice
        default: local
        options: [local, darling]
permissions:
  contents: read
jobs:
  darling-ipc:
    if: inputs.mode == 'darling' || inputs.ipc == 'darling'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned community server sources
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init third_party/darling
          git -C third_party/darling submodule update --init src/external/darlingserver src/external/bootstrap_cmds src/external/xnu src/external/libpthread
          mkdir -p build/darling-evidence
          cp sources.lock.json build/darling-evidence/
          git submodule status > build/darling-evidence/sources.txt
          git -C third_party/darling submodule status src/external/darlingserver src/external/bootstrap_cmds src/external/xnu src/external/libpthread >> build/darling-evidence/sources.txt
          uname -a > build/darling-evidence/environment.txt
          getconf PAGE_SIZE >> build/darling-evidence/environment.txt
      - name: Install native ARM64 server toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build bison flex libbsd-dev
      - name: Build upstream Darling IPC server
        shell: bash
        run: |
          set -euo pipefail
          clang-18 --version >> build/darling-evidence/environment.txt
          cmake --version >> build/darling-evidence/environment.txt
          cmake -S components/darling -B build/darling-compilation -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee build/darling-evidence/configure.log
          cmake --build build/darling-compilation --target darlingserver --parallel 4 2>&1 | tee build/darling-evidence/build.log
          cp build/darling-compilation/darlingserver/darlingserver build/darling-evidence/
          mkdir -p build/darling-evidence/include/darlingserver build/darling-evidence/src
          cp build/darling-compilation/darlingserver/include/darlingserver/rpc.h build/darling-evidence/include/darlingserver/
          cp third_party/darling/src/external/darlingserver/include/darlingserver/rpc-supplement.h build/darling-evidence/include/darlingserver/
          cp build/darling-compilation/darlingserver/src/rpc.c build/darling-evidence/src/
          file build/darling-evidence/darlingserver | tee build/darling-evidence/file.txt
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/darling-evidence --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-darling-ipc
          path: build/darling-evidence/
          retention-days: 30
  host-substrate:
    if: inputs.mode == 'both' || inputs.mode == 'host'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ARM64 host diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host
          cp sources.lock.json build/host/
          uname -a | tee build/host/environment.txt
          getconf PAGE_SIZE | tee -a build/host/environment.txt
          cc --version | tee -a build/host/environment.txt
          cc -Wall -Wextra -Werror -O2 -g tools/host-substrate.c -o build/host/host-substrate
          file build/host/host-substrate | tee build/host/file.txt
          timeout 30 build/host/host-substrate | tee build/host/run.log
          (cd build/host && sha256sum host-substrate > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/host --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-host-substrate
          path: build/host/
          retention-days: 30
  macho-userland:
    if: inputs.mode == 'both' || inputs.mode == 'host'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Mach-O toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Build and execute the freestanding Darwin program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/macho
          cp sources.lock.json build/macho/
          uname -a > build/macho/environment.txt
          clang-18 --version >> build/macho/environment.txt
          ld64.lld-18 --version >> build/macho/environment.txt
          clang-18 --target=arm64-apple-ios13.0 -c guests/hello.S -o build/macho/hello.o
          ld64.lld-18 -arch arm64 -platform_version ios 13.0 13.0 -no_adhoc_codesign -e _start build/macho/hello.o -o build/macho/hello.macho
          llvm-objdump-18 --macho --private-headers build/macho/hello.macho > build/macho/load-commands.txt
          cc -Wall -Wextra -Werror -O2 -g src/macho-host.c -o build/macho/macho-host
          file build/macho/macho-host build/macho/hello.macho | tee build/macho/file.txt
          timeout 30 build/macho/macho-host build/macho/hello.macho > build/macho/guest.stdout 2> build/macho/host.log
          cat build/macho/guest.stdout build/macho/host.log
          (cd build/macho && sha256sum macho-host hello.macho > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/macho --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-macho-userland
          path: build/macho/
          retention-days: 30
  native-userland:
    needs: darling-ipc
    if: always() && (needs.darling-ipc.result == 'success' || needs.darling-ipc.result == 'skipped') && (inputs.mode == 'both' || inputs.mode == 'native' || inputs.mode == 'dyld' || inputs.mode == 'app' || inputs.mode == 'playcover')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.ipc == 'darling'
        with:
          name: linux-arm64-darling-ipc
          path: build/darling-ipc/
      - name: Install ARM64 Mach-O compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libwayland-dev wayland-protocols
      - name: Build and run native Darwin console journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native
          uname -a > build/native/environment.txt
          getconf PAGE_SIZE >> build/native/environment.txt
          cc --version >> build/native/environment.txt
          clang-18 --version >> build/native/environment.txt
          ld64.lld-18 --version >> build/native/environment.txt
          clang-18 --target=arm64-apple-ios12.0 -c guests/console.S -o build/native/console.o
          ld64.lld-18 -arch arm64 -platform_version ios 13.0 13.0 -no_adhoc_codesign -e _start build/native/console.o -o build/native/console.macho
          # A standard link-time interface records a real runtime dependency.
          # It supplies no replacement implementation or fabricated exports.
          clang-18 --target=arm64-apple-ios12.0 -ffreestanding -fno-stack-protector -O1 -g -c guests/dynamic-console.c -o build/native/console-dynamic.o
          ld64.lld-18 -arch arm64 -platform_version ios 12.0 12.0 -no_adhoc_codesign -e _main build/native/console-dynamic.o -needed_library guests/libSystem.tbd -o build/native/console-dynamic.macho
          # ARHello is a UIKit app, not a replacement framework. These TBDs only
          # describe link interfaces; all implementations come from real iOS.
          mkdir -p build/native/ARHello.app
          cp guests/ARHello/Info.plist build/native/ARHello.app/
          clang-18 --target=arm64-apple-ios12.0 -Wall -Wextra -Werror -fno-stack-protector -O1 -g -c guests/ARHello/main.m -o build/native/ARHello.o
          ld64.lld-18 -arch arm64 -platform_version ios 12.0 12.0 -no_adhoc_codesign -e _main build/native/ARHello.o -needed_library guests/libSystem.tbd -needed_library guests/ARHello/UIKit.tbd -needed_library guests/ARHello/Foundation.tbd -needed_library guests/ARHello/libobjc.tbd -o build/native/ARHello.app/ARHello
          llvm-objdump-18 --macho --disassemble --private-headers build/native/console.macho > build/native/image.txt
          rpc_flags=()
          if [[ '${{ inputs.ipc }}' == darling ]]; then
            rpc_flags=(-DARLINUX_DARLING=1 -isystem build/darling-ipc -isystem build/darling-ipc/include)
            cp build/darling-ipc/receipt.json build/native/darling-input-receipt.json
          fi
          cc -Wall -Wextra -Werror -O2 -g -fno-stack-protector -ffreestanding -fno-builtin -mgeneral-regs-only -ffixed-x18 -mno-outline-atomics "${rpc_flags[@]}" -c src/darwin-native.c -o build/native/runtime.o
          cc -c src/darwin-native.S -o build/native/entry.o
          wayland-scanner client-header /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml build/native/xdg-shell-client-protocol.h
          wayland-scanner private-code /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml build/native/xdg-shell-protocol.c
          cc -Wall -Wextra -Werror -O2 -g -Ibuild/native src/macho-native.c build/native/xdg-shell-protocol.c build/native/runtime.o build/native/entry.o -ldl -lwayland-client -pthread -o build/native/macho-native
          # Two complete independent launches of the interactive program, not
          # a source assertion or isolated TLS probe. Runtime exit status is
          # the guest's real Linux-backed normal process exit status.
          for attempt in 1 2; do
            status=0
            printf '+q' | timeout 30 build/native/macho-native build/native/console.macho > build/native/console-$attempt.stdout 2> build/native/console-$attempt.log || status=$?
            cat build/native/console-$attempt.stdout build/native/console-$attempt.log
            if [[ $status != 0 ]]; then exit "$status"; fi
          done
          (cd build/native && sha256sum macho-native console.macho console-dynamic.macho ARHello.app/ARHello ARHello.app/Info.plist > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/native --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-native-darwin
          path: build/native/
          retention-days: 30
  dyld-userland:
    if: always() && needs.native-userland.result == 'success' && (inputs.mode == 'dyld' || inputs.mode == 'app')
    needs: native-userland
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-native-darwin
          path: build/native/
      - uses: actions/download-artifact@v4
        if: inputs.ipc == 'darling'
        with:
          name: linux-arm64-darling-ipc
          path: build/darling-ipc/
      - name: Start embedded Darling IPC service
        if: inputs.ipc == 'darling'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dyld
          prefix=$(mktemp -d /tmp/arlinux-darling.XXXXXX)
          chmod +x build/darling-ipc/darlingserver
          build/darling-ipc/darlingserver --rpc-only "$prefix" > build/dyld/darling.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > build/dyld/darling.pid
          echo "ARLINUX_DARLING_PID=$server_pid" >> "$GITHUB_ENV"
          echo "ARLINUX_DARLING_PREFIX=$prefix" >> "$GITHUB_ENV"
          python3 - "$server_pid" "$prefix" <<'PY'
          import os, pathlib, sys, time
          pid = int(sys.argv[1])
          socket = pathlib.Path(sys.argv[2]) / '.darlingserver.sock'
          deadline = time.monotonic() + 10
          while not socket.is_socket():
              os.kill(pid, 0)
              if time.monotonic() >= deadline:
                  raise SystemExit('Darling RPC socket not created; inspect darling.log')
              time.sleep(.05)
          PY
      - name: Install Apple filesystem reader
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip llvm-18 lldb-18 cmake fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev weston libwayland-client0
      - name: Prepare pinned Apple userland and execute its actual dyld
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dyld
          uname -a > build/dyld/environment.txt
          (cd build/native && sha256sum -c SHA256SUMS)
          chmod +x build/native/macho-native
          python3 tools/prepare-ios-userland.py 2>&1 | tee build/dyld/input.log
          llvm-objdump-18 --macho --private-headers build/ios-input/dyld > build/dyld/loader-commands.txt
          llvm-nm-18 --numeric-sort --demangle build/ios-input/dyld > build/dyld/loader-symbols.txt
          # Inspect the exact wrapper used by this pinned Apple binary. Do not
          # guess a private policy argument structure from a different version.
          llvm-objdump-18 -d --disassemble-symbols=_amfi_check_dyld_policy_self build/ios-input/dyld > build/dyld/amfi-wrapper.txt
          cat build/dyld/amfi-wrapper.txt
          for attempt in 1 2; do
            status=0
            printf '+q' | timeout 30 build/native/macho-native --dyld build/ios-input/dyld --root build/ios-input/filesystem/root build/native/console-dynamic.macho > "build/dyld/console-${attempt}.stdout" 2> "build/dyld/runtime-${attempt}.log" || status=$?
            cat "build/dyld/console-${attempt}.stdout" "build/dyld/runtime-${attempt}.log"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done
      - name: Start native Wayland compositor
        if: inputs.mode == 'app'
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$PWD/build/dyld/wayland-runtime"
          export WAYLAND_DISPLAY=arlinux-ios
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY" >> "$GITHUB_ENV"
          weston --backend=headless-backend.so --renderer=pixman --shell=kiosk-shell.so --no-config --idle-time=0 --socket="$WAYLAND_DISPLAY" --log="$PWD/build/dyld/weston.log" &
          echo $! > build/dyld/weston.pid
          python3 - <<'PY'
          import os, pathlib, time
          socket = pathlib.Path(os.environ['XDG_RUNTIME_DIR']) / os.environ['WAYLAND_DISPLAY']
          deadline = time.monotonic() + 5
          while not socket.is_socket():
              if time.monotonic() >= deadline:
                  raise SystemExit('Weston did not open its Wayland socket; inspect weston.log')
              time.sleep(0.05)
          PY
      - name: Start ARHello 1.0 with real UIKit
        if: inputs.mode == 'app'
        shell: bash
        run: |
          set -euo pipefail
          # The marker chooses the same program for failure-only LLDB capture.
          echo build/native/ARHello.app/ARHello > build/dyld/debugger.program
          python3 -c "import hashlib,json,pathlib; p=pathlib.Path('build/native/ARHello.app/ARHello'); print('APP_INPUT '+json.dumps({'name':'ARHello','version':'1.0','bundleId':'io.arlinux.ARHello','sha256':hashlib.sha256(p.read_bytes()).hexdigest()}))" | tee build/dyld/app-input.json
          status=0
          timeout 30 build/native/macho-native --dyld build/ios-input/dyld --root build/ios-input/filesystem/root build/native/ARHello.app/ARHello > build/dyld/app.stdout 2> build/dyld/app.runtime.log || status=$?
          cat build/dyld/app.stdout build/dyld/app.runtime.log
          echo "APP_PROCESS_STATUS=$status"
          # Even reaching UIApplicationMain is only a startup milestone. The
          # display, touch, normal close and relaunch journey is still required.
          exit "$status"
      - name: Dynamically trace the actual failed dyld journey
        if: failure()
        shell: bash
        run: |
          mkdir -p build/dyld
          if [[ '${{ inputs.ipc }}' == darling ]] && ! kill -0 "$ARLINUX_DARLING_PID" 2>/dev/null; then
            echo 'DARLING_SERVER_UNAVAILABLE original service exited; preserve darling.log; no live IPC server for the LLDB retry'
            exit 0
          fi
          printf '+q' > build/dyld/debugger.stdin
          cache=build/ios-input/filesystem/root/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64
          ordinary=build/dyld/app.runtime.log
          if [[ ! -f "$ordinary" ]]; then ordinary=build/dyld/runtime-1.log; fi
          if [[ -f "$cache" && -f "$ordinary" ]]; then
            python3 tools/symbolicate-cache.py "$cache" "$ordinary" build/dyld/diagnostic-symbols.json \
              --lookup /usr/lib/libobjc.A.dylib _objc_exception_throw \
              --lookup /System/Library/Frameworks/Security.framework/Security _SecTaskCreateFromSelf \
              --lookup /System/Library/Frameworks/Security.framework/Security _SecTaskCopyValueForEntitlement \
              --lookup /System/Library/PrivateFrameworks/UIKitCore.framework/UIKitCore __UICopyValueForEntitlementUsingTaskCreationBlock \
              --lookup /System/Library/Frameworks/QuartzCore.framework/QuartzCore '_OBJC_CLASS_$_CADisplay' \
              --lookup /System/Library/Frameworks/QuartzCore.framework/QuartzCore '_OBJC_CLASS_$_CADisplayMode' \
              --lookup /System/Library/PrivateFrameworks/BackBoardServices.framework/BackBoardServices _BKSDisplayServicesStart \
              --lookup /System/Library/PrivateFrameworks/GraphicsServices.framework/GraphicsServices __GSRegisterPurpleNamedPortInPrivateNamespace \
              --lookup /System/Library/PrivateFrameworks/GraphicsServices.framework/GraphicsServices __GSWriteStackshot \
              --lookup /usr/lib/system/libxpc.dylib _bootstrap_look_up \
              --lookup /usr/lib/system/libxpc.dylib _bootstrap_look_up2 \
              --lookup /usr/lib/system/libxpc.dylib _bootstrap_look_up3 \
              --lookup /usr/lib/system/libxpc.dylib _bootstrap_register \
              --lookup /usr/lib/system/libxpc.dylib _bootstrap_register2
          fi
          status=0
          timeout 45 lldb-18 --batch -o 'command source -e true -s false tools/trace-dyld.lldb' > build/dyld/lldb.log 2>&1 || status=$?
          cat build/dyld/lldb.log
          echo "LLDB_COMMAND_STATUS=$status"
          if [[ -f build/ios-input/filesystem/root/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64 ]]; then
            python3 tools/symbolicate-cache.py build/ios-input/filesystem/root/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64 build/dyld/lldb.log build/dyld/cache-frames.json
          fi
          exit "$status"
      - name: Stop runner Wayland compositor
        if: always() && inputs.mode == 'app'
        shell: bash
        run: |
          if [[ -f build/dyld/weston.pid ]]; then
            kill -- "$(cat build/dyld/weston.pid)" || true
          fi
      - name: Stop embedded Darling service
        if: always() && inputs.ipc == 'darling'
        shell: bash
        run: |
          if [[ -f build/dyld/darling.pid ]]; then
            kill -- "$(cat build/dyld/darling.pid)" 2>/dev/null || true
          fi
          if [[ -f build/dyld/darling.log ]]; then cat build/dyld/darling.log; fi
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/dyld --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-apple-dyld-evidence
          path: |
            build/dyld/
            !build/dyld/wayland-runtime/**
          retention-days: 30
  playcover-reference:
    if: always() && needs.native-userland.result == 'success' && inputs.mode == 'playcover'
    needs: native-userland
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-native-darwin
          path: build/native/
      - name: Observe the same iOS app through PlayCover conversion on macOS
        shell: bash
        run: |
          set -euo pipefail
          (cd build/native && shasum -a 256 -c SHA256SUMS)
          mkdir -p build/playcover
          uname -a > build/playcover/environment.txt
          sw_vers >> build/playcover/environment.txt
          xcodebuild -version >> build/playcover/environment.txt
          python3 tools/run-playcover-reference.py
      - name: Record reference receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/playcover --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-playcover-reference
          path: build/playcover/
          retention-days: 30
  xnu-baseline:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned ios-sweet XNU baseline (not usermode)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-baseline.sh 2>&1 | tee baseline.log
      - name: Retain provenance and logs
        if: always()
        shell: bash
        run: |
          mkdir -p out-baseline
          cp sources.lock.json out-baseline/
          cp baseline.log out-baseline/ || true
          sw_vers > out-baseline/environment.txt
          xcodebuild -version >> out-baseline/environment.txt
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory out-baseline --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
          retention-days: 30
  xnu-reference-boot:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    needs: xnu-baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
      - name: Install full-system ARM64 execution and symbol tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm llvm
      - name: Execute original XNU process journey (reference only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference
          bash tools/run-baseline.sh 2>&1 | tee build/reference/run.log
      - name: Record reference receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/reference --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-full-system-reference
          path: build/reference/
          retention-days: 30
