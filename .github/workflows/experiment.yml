name: XNU usermode feasibility
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: both
        options: [both, host, baseline, kernel]
permissions:
  contents: read
jobs:
  host-substrate:
    if: inputs.mode == 'both' || inputs.mode == 'host'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ARM64 host diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host
          cp sources.lock.json build/host/
          uname -a | tee build/host/environment.txt
          getconf PAGE_SIZE | tee -a build/host/environment.txt
          cc --version | tee -a build/host/environment.txt
          cc -Wall -Wextra -Werror -O2 -g tools/host-substrate.c -o build/host/host-substrate
          file build/host/host-substrate | tee build/host/file.txt
          timeout 30 build/host/host-substrate | tee build/host/run.log
          (cd build/host && sha256sum host-substrate > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/host --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-host-substrate
          path: build/host/
          retention-days: 30
  macho-userland:
    if: inputs.mode == 'both' || inputs.mode == 'host'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Mach-O toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Build and execute the freestanding Darwin program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/macho
          cp sources.lock.json build/macho/
          uname -a > build/macho/environment.txt
          clang-18 --version >> build/macho/environment.txt
          ld64.lld-18 --version >> build/macho/environment.txt
          clang-18 --target=arm64-apple-ios13.0 -c guests/hello.S -o build/macho/hello.o
          ld64.lld-18 -arch arm64 -platform_version ios 13.0 13.0 -no_adhoc_codesign -e _start build/macho/hello.o -o build/macho/hello.macho
          llvm-objdump-18 --macho --private-headers build/macho/hello.macho > build/macho/load-commands.txt
          cc -Wall -Wextra -Werror -O2 -g src/macho-host.c -o build/macho/macho-host
          file build/macho/macho-host build/macho/hello.macho | tee build/macho/file.txt
          timeout 30 build/macho/macho-host build/macho/hello.macho > build/macho/guest.stdout 2> build/macho/host.log
          cat build/macho/guest.stdout build/macho/host.log
          (cd build/macho && sha256sum macho-host hello.macho > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/macho --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-macho-userland
          path: build/macho/
          retention-days: 30
  xnu-baseline:
    if: inputs.mode == 'both' || inputs.mode == 'baseline'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned ios-sweet XNU baseline (not usermode)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-baseline.sh 2>&1 | tee baseline.log
      - name: Retain provenance and logs
        if: always()
        shell: bash
        run: |
          mkdir -p out-baseline
          cp sources.lock.json out-baseline/
          cp baseline.log out-baseline/ || true
          sw_vers > out-baseline/environment.txt
          xcodebuild -version >> out-baseline/environment.txt
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory out-baseline --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-baremetal-baseline
          path: out-baseline/
          retention-days: 30
  xnu-kernel-headers:
    if: inputs.mode == 'both' || inputs.mode == 'kernel'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Linux kernel port toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 flex bison tcsh unifdef cmake
      - name: Generate pinned XNU configuration and Mach interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/kernel
          uname -a > build/kernel/environment.txt
          clang-18 --version >> build/kernel/environment.txt
          python3 tools/build-xnu-kernel.py --phase prepare 2>&1 | tee build/kernel/build.log
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/kernel --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-linux-arm64-kernel-headers
          path: build/kernel/
          retention-days: 30
  xnu-kernel:
    if: inputs.mode == 'both' || inputs.mode == 'kernel'
    needs: xnu-kernel-headers
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: xnu-linux-arm64-kernel-headers
          path: build/kernel/
      - name: Cross-compile actual XNU as Linux ARM64 ELF with Apple Clang
        shell: bash
        run: |
          set -euo pipefail
          mv build/kernel/receipt.json build/kernel/headers-receipt.json
          sw_vers > build/kernel/compiler-environment.txt
          xcodebuild -version >> build/kernel/compiler-environment.txt
          clang --version >> build/kernel/compiler-environment.txt
          python3 tools/build-xnu-kernel.py --phase compile --compiler clang 2>&1 | tee build/kernel/compile.log
          file build/kernel/*.o | tee build/kernel/object-formats.txt
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/kernel --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-linux-arm64-kernel-port
          path: build/kernel/
          retention-days: 30
  xnu-link-inputs:
    if: inputs.mode == 'both' || inputs.mode == 'kernel'
    needs: xnu-kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-linux-arm64-kernel-port
          path: build/kernel/
      - name: Inspect real kernel link dependencies on Linux (not executable)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lld-18 llvm-18
          mkdir -p build/link
          cp build/kernel/receipt.json build/link/compiler-receipt.json
          uname -a > build/link/environment.txt
          ld.lld-18 --version >> build/link/environment.txt
          ld.lld-18 -r build/kernel/*.o -o build/link/xnu-host.partial.o 2>&1 | tee build/link/link.log
          llvm-readelf-18 --file-header --sections build/link/xnu-host.partial.o > build/link/elf.txt
          llvm-nm-18 --undefined-only --format=posix build/link/xnu-host.partial.o > build/link/unresolved-symbols.txt
          llvm-objdump-18 --disassemble --no-show-raw-insn build/link/xnu-host.partial.o > build/link/disassembly.txt
          (cd build/link && sha256sum xnu-host.partial.o > SHA256SUMS)
          cat build/link/unresolved-symbols.txt
          echo 'Relocatable link only: unresolved kernel and host services remain; no executable or boot.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/link --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-linux-arm64-link-dependencies
          path: build/link/
          retention-days: 30
  xnu-early-startup:
    if: inputs.mode == 'both' || inputs.mode == 'kernel'
    needs: xnu-kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-linux-arm64-kernel-port
          path: build/kernel/
      - name: Link and execute actual XNU early startup (not VM or guest boot)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/startup
          cp build/kernel/receipt.json build/startup/compiler-receipt.json
          uname -a > build/startup/environment.txt
          cc --version >> build/startup/environment.txt
          cc -Wall -Wextra -Werror -O1 -g -pthread -Isrc/xnu-host/include -ffunction-sections -fdata-sections -c src/xnu-host/host.c -o build/startup/host.o
          cc -no-pie -pthread -Wl,--gc-sections -Wl,-T,src/xnu-host/startup.ld build/startup/host.o build/kernel/startup.o build/kernel/xnu_bootstrap.o build/kernel/context.o -o build/startup/xnu-host 2>&1 | tee build/startup/link.log
          file build/startup/xnu-host > build/startup/file.txt
          timeout 30 build/startup/xnu-host startup_debug=1 > build/startup/stdout.txt 2> build/startup/stderr.txt
          cat build/startup/stdout.txt build/startup/stderr.txt
          (cd build/startup && sha256sum xnu-host > SHA256SUMS)
          echo 'Executed upstream XNU early initialization only. VM/tasks/guest execution remain outstanding.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/startup --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-linux-arm64-early-startup
          path: build/startup/
          retention-days: 30
  xnu-vm-startup:
    if: inputs.mode == 'both' || inputs.mode == 'kernel'
    needs: [xnu-kernel, xnu-early-startup]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-linux-arm64-kernel-port
          path: build/kernel/
      - name: Link and attempt actual XNU VM bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vm
          cp build/kernel/receipt.json build/vm/compiler-receipt.json
          uname -a > build/vm/environment.txt
          cc --version >> build/vm/environment.txt
          cc -Wall -Wextra -Werror -O1 -g -pthread -Isrc/xnu-host/include -DXNU_HOST_BOOT_VM -ffunction-sections -fdata-sections -c src/xnu-host/host.c -o build/vm/host.o
          ar rcs build/vm/libxnu.a build/kernel/*.o
          cc -no-pie -pthread -Wl,--gc-sections -Wl,-T,src/xnu-host/startup.ld -Wl,-Map,build/vm/link-map.txt build/vm/host.o -Wl,--start-group build/vm/libxnu.a -Wl,--end-group -o build/vm/xnu-host 2>&1 | tee build/vm/link.log
          file build/vm/xnu-host > build/vm/file.txt
          timeout 30 build/vm/xnu-host startup_debug=1 > build/vm/stdout.txt 2> build/vm/stderr.txt
          cat build/vm/stdout.txt build/vm/stderr.txt
          (cd build/vm && sha256sum xnu-host > SHA256SUMS)
      - name: Record experiment receipt
        if: always()
        run: python3 tools/experiment-receipt.py --directory build/vm --outcome '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-linux-arm64-vm-startup
          path: build/vm/
          retention-days: 30
